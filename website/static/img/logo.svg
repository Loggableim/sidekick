<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C542;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4961C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#07070d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="34" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3"/>

  <g transform="translate(100, 95)" filter="url(#glow)">
    <!-- Staff -->
    <rect x="-4" y="-55" width="8" height="130" rx="4" fill="url(#gold)"/>
    <!-- Wings -->
    <path d="M-4 -35 C-30 -50, -65 -45, -75 -35 C-55 -40, -30 -42, -6 -32" fill="#F5C542" opacity="0.85"/>
    <path d="M-4 -27 C-28 -40, -58 -38, -68 -30 C-48 -36, -25 -38, -6 -28" fill="#D4961C" opacity="0.75"/>
    <path d="M4 -35 C30 -50, 65 -45, 75 -35 C55 -40, 30 -42, 6 -32" fill="#F5C542" opacity="0.85"/>
    <path d="M4 -27 C28 -40, 58 -38, 68 -30 C48 -36, 25 -38, 6 -28" fill="#D4961C" opacity="0.75"/>
    <!-- Serpents -->
    <path d="M-4 65 C-20 55, -25 40, -18 30 C-25 34, -28 48, -22 55 C-30 45, -24 28, -10 20 C-18 28, -22 42, -15 50" fill="none" stroke="#F5C542" stroke-width="3" stroke-linecap="round"/>
    <path d="M4 65 C20 55, 25 40, 18 30 C25 34, 28 48, 22 55 C30 45, 24 28, 10 20 C18 28, 22 42, 15 50" fill="none" stroke="#D4961C" stroke-width="3" stroke-linecap="round"/>
    <!-- Orb -->
    <circle cx="0" cy="-55" r="8" fill="url(#gold)"/>
    <circle cx="0" cy="-55" r="3.5" fill="#FFF8E1" opacity="0.5"/>
  </g>

  <text x="100" y="185" text-anchor="middle" fill="url(#gold)" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2">SIDEKICK</text>
</svg>