<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick Model Picker Dialog</title>
  <desc id="desc">Model selection dialog showing available providers and models in a dark-theme modal.</desc>
  <rect width="800" height="520" rx="16" fill="#0f0f18" stroke="#2b2410" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" rx="16" fill="#11111a" stroke="#2b2410" stroke-width="1"/>
  <text x="40" y="36" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="18" font-weight="600">Change Model</text>
  <rect x="720" y="18" width="20" height="20" rx="6" fill="#1a1a28" stroke="#4a4a5a" stroke-width="1"/>
  <text x="726" y="33" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">✕</text>

  <!-- Current model indicator -->
  <rect x="40" y="72" width="720" height="44" rx="10" fill="#1a1a28" stroke="#F5C542" stroke-width="0.5"/>
  <text x="60" y="98" fill="#bababa" font-family="'Inter', sans-serif" font-size="13">Current: <tspan fill="#FFD700" font-weight="600">codestral-latest (opencode-go)</tspan></text>

  <!-- Provider list -->
  <text x="40" y="144" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">PROVIDERS</text>

  <g transform="translate(40, 156)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#1a1a28" stroke="#F5C542" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#27c93f"/>
    <text x="30" y="24" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">opencode-go</text>
    <text x="200" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="11">5 keys · 30 slots</text>
  </g>

  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <circle cx="16" cy="18" r="4" fill="#6a6a7a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">opencode-zen</text>
    <text x="200" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="11">active</text>
  </g>

  <g transform="translate(40, 244)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <circle cx="16" cy="18" r="4" fill="#6a6a7a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">nvidia (8B)</text>
  </g>

  <g transform="translate(40, 288)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <circle cx="16" cy="18" r="4" fill="#6a6a7a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">openrouter</text>
    <text x="200" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="11">200+ models</text>
  </g>

  <!-- Model list -->
  <text x="420" y="144" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">MODELS</text>

  <g transform="translate(420, 156)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#1a1a28" stroke="#27c93f" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#27c93f"/>
    <text x="30" y="24" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">codestral-latest</text>
    <text x="230" y="24" fill="#27c93f" font-family="'Inter', sans-serif" font-size="11">Active</text>
  </g>

  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">deepseek-chat</text>
  </g>

  <g transform="translate(420, 244)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">qwen-3-32b</text>
  </g>

  <g transform="translate(420, 288)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#11111a"/>
    <text x="30" y="24" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">nemotron-70b</text>
  </g>

  <!-- Footer -->
  <line x1="0" y1="464" x2="800" y2="464" stroke="#2b2410" stroke-width="0.5"/>
  <rect x="40" y="476" width="160" height="32" rx="16" fill="#11111a" stroke="#3a3217" stroke-width="1"/>
  <text x="120" y="496" text-anchor="middle" fill="#bababa" font-family="'Inter', sans-serif" font-size="13">Cancel</text>
  <rect x="620" y="476" width="140" height="32" rx="16" fill="#F5C542"/>
  <text x="690" y="496" text-anchor="middle" fill="#0a0a12" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Apply</text>
</svg>