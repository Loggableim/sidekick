<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick Dashboard Overview</title>
  <desc id="desc">Full WebUI dashboard showing chat interface, model selector, status panel, and settings.</desc>

  <!-- Background -->
  <rect width="1200" height="720" rx="16" fill="#0a0a12"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#2b2410" stroke-width="1"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="720" fill="#07070d"/>
  <rect x="259" y="0" width="1" height="720" fill="#2b2410"/>

  <!-- Sidebar header -->
  <rect x="20" y="20" width="220" height="40" rx="8" fill="#0f0f18" stroke="#3a3217" stroke-width="1"/>
  <text x="40" y="46" fill="#FFD700" font-family="'Inter', sans-serif" font-size="16" font-weight="700">☤ SIDEKICK</text>

  <!-- Sidebar nav items -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#1a1a28" stroke="#F5C542" stroke-width="0.5"/>
    <text x="14" y="24" fill="#FFD700" font-family="'Inter', sans-serif" font-size="14">💬 Chat</text>
  </g>
  <g transform="translate(20, 124)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="none"/>
    <text x="14" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">⚙ Settings</text>
  </g>
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="none"/>
    <text x="14" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">🔌 Plugins</text>
  </g>
  <g transform="translate(20, 212)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="none"/>
    <text x="14" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">📦 Skills</text>
  </g>
  <g transform="translate(20, 256)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="none"/>
    <text x="14" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">🕐 Sessions</text>
  </g>
  <g transform="translate(20, 300)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="none"/>
    <text x="14" y="24" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="14">🔄 Cron</text>
  </g>

  <!-- Sidebar footer -->
  <rect x="20" y="660" width="220" height="40" rx="8" fill="#11111a" stroke="#2b2410" stroke-width="0.5"/>
  <text x="40" y="686" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="12">v0.13.0 — Connected</text>

  <!-- Main area -->
  <!-- Top bar -->
  <rect x="280" y="0" width="920" height="56" fill="#0a0a12"/>
  <line x1="280" y1="56" x2="1200" y2="56" stroke="#2b2410" stroke-width="0.5"/>

  <text x="300" y="36" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="20" font-weight="600">Sidekick Agent</text>

  <!-- Model indicator -->
  <rect x="980" y="16" width="200" height="28" rx="14" fill="#11111a" stroke="#3a3217" stroke-width="0.5"/>
  <circle cx="1000" cy="30" r="4" fill="#27c93f"/>
  <text x="1014" y="34" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="12">codestral-latest</text>

  <!-- Conversation area -->
  <rect x="280" y="72" width="900" height="520" rx="12" fill="#0f0f18"/>

  <!-- User message -->
  <rect x="310" y="92" width="480" height="36" rx="18" fill="#1a1a28"/>
  <text x="330" y="114" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="14">What does the codebase structure look like?</text>

  <!-- Assistant message -->
  <rect x="310" y="144" width="780" height="120" rx="12" fill="#11111a" stroke="#2b2410" stroke-width="0.5"/>
  <text x="330" y="168" fill="#FFD700" font-family="'Inter', sans-serif" font-size="13" font-weight="600">☤ Sidekick</text>
  <text x="330" y="192" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">Let me explore the project structure...</text>
  <text x="330" y="216" fill="#7ce38b" font-family="'Inter', sans-serif" font-size="13">┊ terminal: find . -type f -name "*.py" | head -30</text>
  <text x="330" y="240" fill="#7ce38b" font-family="'Inter', sans-serif" font-size="13">┊ Done — 347 Python files found</text>

  <!-- Assistant message 2 -->
  <rect x="310" y="280" width="780" height="80" rx="12" fill="#11111a" stroke="#2b2410" stroke-width="0.5"/>
  <text x="330" y="304" fill="#FFD700" font-family="'Inter', sans-serif" font-size="13" font-weight="600">☤ Sidekick</text>
  <text x="330" y="328" fill="#b8b8c8" font-family="'Inter', sans-serif" font-size="13">The project has a clean modular structure:</text>
  <text x="330" y="348" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="12">• <tspan fill="#b8b8c8">agent/</tspan> — Core agent loop, adapters, prompts</text>

  <!-- Input area -->
  <rect x="290" y="608" width="880" height="40" rx="20" fill="#11111a" stroke="#3a3217" stroke-width="1"/>
  <text x="310" y="632" fill="#4a4a5a" font-family="'Inter', sans-serif" font-size="14">Message Sidekick...</text>
  <rect x="1100" y="614" width="55" height="28" rx="14" fill="#F5C542"/>
  <text x="1116" y="633" fill="#0a0a12" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Send</text>

  <!-- Status bar -->
  <rect x="280" y="664" width="920" height="56" fill="#0a0a12"/>
  <line x1="280" y1="664" x2="1200" y2="664" stroke="#2b2410" stroke-width="0.5"/>
  <text x="300" y="692" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="12">Tokens: 1,247 | Tools used: 3 | Session: 20260607_abc123</text>
  <text x="1030" y="692" fill="#27c93f" font-family="'Inter', sans-serif" font-size="12">● Running</text>
</svg>