<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick Model Use-As Dropdown</title>
  <desc id="desc">Compact dropdown showing model role assignment: main vs. auxiliary vs. vision.</desc>
  <rect width="600" height="120" rx="12" fill="#0f0f18" stroke="#2b2410" stroke-width="1"/>

  <text x="30" y="30" fill="#bababa" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Model Assignment</text>
  <text x="30" y="52" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="12">Choose how this model is used:</text>

  <g transform="translate(30, 66)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#1a1a28" stroke="#F5C542" stroke-width="1"/>
    <text x="16" y="21" fill="#e8e4dc" font-family="'Inter', sans-serif" font-size="13">🤖 Main agent</text>
  </g>
  <g transform="translate(204, 66)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#11111a"/>
    <text x="16" y="21" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="13">⚙ Auxiliary</text>
  </g>
  <g transform="translate(378, 66)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="#11111a"/>
    <text x="16" y="21" fill="#6a6a7a" font-family="'Inter', sans-serif" font-size="13">👁 Vision</text>
  </g>
</svg>