<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070d;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0a0a18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050510;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C542;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4961C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="circuits" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 L20 40 L20 20 L40 20 L40 40 L60 40 L60 20 L80 20" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.3"/>
      <path d="M40 0 L40 20 L20 20 L20 40 L40 40 L40 60 L60 60 L60 80" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#circuits)"/>

  <circle cx="300" cy="240" r="200" fill="#F5C542" opacity="0.02" filter="url(#glow)"/>
  <circle cx="950" cy="200" r="150" fill="#00d4aa" opacity="0.015" filter="url(#glow)"/>

  <!-- Large Caduceus -->
  <g transform="translate(90, 50)" filter="url(#glow)">
    <rect x="140" y="50" width="10" height="260" rx="5" fill="url(#gold)"/>
    <path d="M145 100 C110 80, 60 90, 45 110 C70 100, 100 96, 130 110" fill="#F5C542" opacity="0.85"/>
    <path d="M145 116 C112 100, 68 106, 52 124 C72 114, 100 110, 132 122" fill="#D4961C" opacity="0.75"/>
    <path d="M155 100 C190 80, 240 90, 255 110 C230 100, 200 96, 170 110" fill="#F5C542" opacity="0.85"/>
    <path d="M155 116 C188 100, 232 106, 248 124 C228 114, 200 110, 168 122" fill="#D4961C" opacity="0.75"/>
    <path d="M150 260 C125 245, 118 228, 128 215 C118 220, 114 238, 122 248 C110 232, 118 208, 140 198 C128 208, 122 228, 132 238" fill="none" stroke="#F5C542" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 260 C175 245, 182 228, 172 215 C182 220, 186 238, 178 248 C190 232, 182 208, 160 198 C172 208, 178 228, 168 238" fill="none" stroke="#D4961C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="145" cy="50" r="12" fill="url(#gold)"/>
    <circle cx="145" cy="50" r="6" fill="#FFF8E1" opacity="0.5"/>
  </g>

  <!-- Sidekick Agent Title -->
  <text x="480" y="180" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="url(#goldText)" letter-spacing="4">SIDEKICK</text>
  <text x="480" y="250" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="300" fill="#b8b8c8" letter-spacing="8">AGENT</text>

  <line x1="480" y1="280" x2="780" y2="280" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <text x="480" y="315" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#6a6a7a" letter-spacing="3">THE SELF-IMPROVING AI AGENT</text>
  <text x="480" y="345" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#4a4a5a" letter-spacing="1">CREATES SKILLS FROM EXPERIENCE · IMPROVES DURING USE · RUNS ANYWHERE</text>

  <!-- Feature pills -->
  <g transform="translate(480, 380)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#1a1a2e" stroke="#F5C542" stroke-width="0.5" opacity="0.7"/>
    <text x="60" y="19" text-anchor="middle" fill="#FFD700" font-family="'Inter', sans-serif" font-size="11" font-weight="600">OPEN SOURCE</text>
    <rect x="135" y="0" width="120" height="28" rx="14" fill="#1a1a2e" stroke="#F5C542" stroke-width="0.5" opacity="0.7"/>
    <text x="195" y="19" text-anchor="middle" fill="#FFD700" font-family="'Inter', sans-serif" font-size="11" font-weight="600">MULTI-PLATFORM</text>
    <rect x="270" y="0" width="140" height="28" rx="14" fill="#1a1a2e" stroke="#F5C542" stroke-width="0.5" opacity="0.7"/>
    <text x="340" y="19" text-anchor="middle" fill="#FFD700" font-family="'Inter', sans-serif" font-size="11" font-weight="600">SELF-IMPROVING</text>
  </g>

  <line x1="0" y1="477" x2="1200" y2="477" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="479" x2="1200" y2="479" stroke="url(#teal)" stroke-width="1" opacity="0.2"/>
</svg>