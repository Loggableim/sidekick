<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidekick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header id="header">
      <div class="header-left">
        <h1>Sidekick</h1>
        <span class="version">v0.1.0</span>
      </div>
      <div class="header-right">
        <span class="status-label">Hermes Status</span>
        <span id="status-badge" class="badge badge-idle">Nicht gestartet</span>
      </div>
    </header>

    <!-- STATUS -->
    <section id="status-bar">
      <div id="error-display" class="error-display hidden">
        <span class="error-label">Letzter Fehler:</span>
        <span id="error-text"></span>
        <button id="error-dismiss" class="btn-icon" title="Schließen">&times;</button>
      </div>
    </section>

    <!-- MAIN LAYOUT -->
    <div id="main-layout">
      <!-- LEFT: Controls & Settings -->
      <aside id="sidebar">
        <!-- ACTIONS -->
        <div id="actions" class="card">
          <h2>Aktionen</h2>
          <div class="action-grid">
            <button id="btn-start" class="btn btn-primary" onclick="startHermes()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <polygon points="5,3 19,12 5,21" fill="currentColor"/>
              </svg>
              Hermes starten
            </button>
            <button id="btn-restart" class="btn btn-secondary" onclick="restartHermes()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
              </svg>
              Hermes neu starten
            </button>
            <button id="btn-stop" class="btn btn-danger" onclick="stopHermes()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
              </svg>
              Hermes stoppen
            </button>
            <button id="btn-logs" class="btn btn-outline" onclick="openLogs()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/>
              </svg>
              Logs öffnen
            </button>
            <button id="btn-appdata" class="btn btn-outline" onclick="openAppData()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" fill="currentColor"/>
              </svg>
              AppData öffnen
            </button>
            <button id="btn-browser" class="btn btn-outline" onclick="openBrowser()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H5V6h14v12z" fill="currentColor"/>
                <path d="M7 10h10v2H7zm0 4h6v2H7z" fill="currentColor"/>
              </svg>
              Im Browser öffnen
            </button>
          </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" class="card">
          <h2>Einstellungen</h2>
          <div class="setting-row">
            <label for="port">Port</label>
            <input type="number" id="port" class="input-field" min="1024" max="65535" value="8787">
          </div>
          <div class="setting-row">
            <label class="checkbox-label">
              <input type="checkbox" id="autostart" checked>
              <span>Auto-Start</span>
            </label>
          </div>
          <div class="setting-row">
            <label for="python-path">Python-Pfad</label>
            <input type="text" id="python-path" class="input-field" placeholder="python">
          </div>
          <div class="setting-row">
            <label for="hermes-path">Hermes-Pfad</label>
            <input type="text" id="hermes-path" class="input-field" placeholder="./vendor/hermes-webui">
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveSettings()">Einstellungen speichern</button>
        </div>
      </aside>

      <!-- RIGHT: Logs + WebView -->
      <main id="content">
        <!-- LOG PANEL -->
        <div id="log-panel" class="card">
          <div class="card-header">
            <h2>Logs</h2>
            <button id="btn-clear-logs" class="btn btn-sm btn-outline" onclick="clearLogs()">Leeren</button>
          </div>
          <textarea id="log-output" class="log-textarea" readonly wrap="off" placeholder="Logs werden hier angezeigt..."></textarea>
        </div>

        <!-- WEBVIEW EMBED -->
        <div id="webview-panel" class="card">
          <div class="card-header">
            <h2>Hermes WebUI</h2>
            <span id="webview-status" class="badge badge-idle">Nicht geladen</span>
          </div>
          <div id="webview-container">
            <div id="webview-placeholder" class="webview-placeholder">
              <svg viewBox="0 0 24 24" width="48" height="48" class="placeholder-icon">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/>
              </svg>
              <p>Hermes WebUI wird geladen, sobald das Backend bereit ist.</p>
            </div>
            <iframe id="webview-frame" class="webview-frame hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" loading="lazy"></iframe>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
