<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidekick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header id="header">
      <div class="header-left">
        <h1>Sidekick</h1>
        <span class="version">v0.1.0</span>
        <span id="mode-badge" class="badge badge-info">REAL IPC</span>
      </div>
      <div class="header-right">
        <span class="status-label">Status</span>
        <span id="status-badge" class="badge badge-idle">Nicht gestartet</span>
      </div>
    </header>

    <!-- STATUS / ERROR -->
    <section id="status-bar">
      <div id="error-display" class="error-display hidden">
        <span class="error-label">Letzter Fehler:</span>
        <span id="error-text"></span>
        <button id="error-dismiss" class="btn-icon" title="Schließen">&times;</button>
      </div>
    </section>

    <!-- MAIN LAYOUT -->
    <div id="main-layout">
      <!-- LEFT: Controls & Settings -->
      <aside id="sidebar">
        <!-- MODE INDICATOR -->
        <div id="mode-card" class="card mode-real">
          <span id="mode-text">Modus: Echter Tauri IPC</span>
        </div>

        <!-- ACTIONS -->
        <div id="actions" class="card">
          <h2>Aktionen</h2>
          <div class="action-grid">
            <button id="btn-start" class="btn btn-primary" onclick="startSidekick()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <polygon points="5,3 19,12 5,21" fill="currentColor"/>
              </svg>
              Sidekick starten
            </button>
            <button id="btn-restart" class="btn btn-secondary" onclick="restartSidekick()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
              </svg>
              Sidekick neu starten
            </button>
            <button id="btn-stop" class="btn btn-danger" onclick="stopSidekick()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
              </svg>
              Sidekick stoppen
            </button>
            <button id="btn-webui-open" class="btn btn-accent" onclick="openWebUI()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H5V6h14v12z" fill="currentColor"/>
                <path d="M7 10h10v2H7zm0 4h6v2H7z" fill="currentColor"/>
              </svg>
              WebUI öffnen
            </button>
            <button id="btn-webui-focus" class="btn btn-outline" onclick="focusWebUI()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm-7 4c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7-7-3.13-7-7z" fill="currentColor"/>
              </svg>
              WebUI fokussieren
            </button>
            <button id="btn-browser" class="btn btn-outline" onclick="openBrowser()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H5V6h14v12z" fill="currentColor"/>
                <path d="M7 10h10v2H7zm0 4h6v2H7z" fill="currentColor"/>
              </svg>
              Im Browser öffnen
            </button>
            <button id="btn-logs" class="btn btn-outline" onclick="openLogs()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/>
              </svg>
              Logs öffnen
            </button>
            <button id="btn-appdata" class="btn btn-outline" onclick="openAppData()">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z" fill="currentColor"/>
              </svg>
              AppData öffnen
            </button>
          </div>
        </div>

        <!-- WEBUI STATUS CARD (ersetzt iframe) -->
        <div id="webui-status-card" class="card">
          <h2>Sidekick WebUI</h2>
          <div class="webui-status-content">
            <div class="webui-info-row">
              <span class="webui-label">Status:</span>
              <span id="webview-status" class="badge badge-idle">Nicht geladen</span>
            </div>
            <div class="webui-info-row">
              <span class="webui-label">URL:</span>
              <span id="webui-url" class="webui-url-text">http://127.0.0.1:8787</span>
            </div>
            <div id="webui-error-card" class="webui-error hidden">
              <p class="webui-error-msg" id="webui-error-text"></p>
            </div>
            <div class="webui-actions">
              <button class="btn btn-sm btn-accent" onclick="openWebUI()">WebUI öffnen</button>
              <button class="btn btn-sm btn-outline" onclick="focusWebUI()">Fokussieren</button>
              <button class="btn btn-sm btn-outline" onclick="openBrowser()">Im Browser</button>
              <button class="btn btn-sm btn-outline" onclick="openLogs()">Logs</button>
            </div>
          </div>
        </div>

        <!-- SETTINGS -->
        <div id="settings" class="card">
          <h2>Einstellungen</h2>
          <div class="setting-row">
            <label for="port">Port</label>
            <input type="number" id="port" class="input-field" min="1024" max="65535" value="8787">
          </div>
          <div class="setting-row">
            <label class="checkbox-label">
              <input type="checkbox" id="autostart" checked>
              <span>Auto-Start</span>
            </label>
          </div>
          <div class="setting-row">
            <label for="python-path">Python-Pfad</label>
            <input type="text" id="python-path" class="input-field" placeholder="python">
          </div>
          <div class="setting-row">
            <label for="sidekick-path">Sidekick-Pfad</label>
            <input type="text" id="sidekick-path" class="input-field" placeholder="./vendor/hermes-webui">
          </div>
          <div class="setting-row">
            <label for="webui-mode">WebUI öffnen als:</label>
            <select id="webui-mode" class="input-field">
              <option value="window">Separates Tauri-Fenster</option>
              <option value="browser">Externer Browser</option>
              <option value="disabled">Deaktiviert</option>
            </select>
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveSettings()">Einstellungen speichern</button>
        </div>
      </aside>

      <!-- RIGHT: Logs -->
      <main id="content">
        <!-- LOG PANEL -->
        <div id="log-panel" class="card">
          <div class="card-header">
            <h2>Logs</h2>
            <div class="card-header-actions">
              <button id="btn-filter-dev" class="btn btn-sm btn-filter active" onclick="toggleFilter('DEV')">DEV</button>
              <button id="btn-filter-status" class="btn btn-sm btn-filter active" onclick="toggleFilter('STATUS')">STATUS</button>
              <button id="btn-filter-webui" class="btn btn-sm btn-filter active" onclick="toggleFilter('WEBUI')">WEBUI</button>
              <button id="btn-filter-error" class="btn btn-sm btn-filter active" onclick="toggleFilter('FEHLER')">ERROR</button>
              <button id="btn-copy-logs" class="btn btn-sm btn-outline" onclick="copyLogs()">Kopieren</button>
              <button id="btn-clear-logs" class="btn btn-sm btn-outline" onclick="clearLogs()">Leeren</button>
            </div>
          </div>
          <textarea id="log-output" class="log-textarea" readonly wrap="off" placeholder="Logs werden hier angezeigt..."></textarea>
        </div>
      </main>
    </div>
  </div>

  <script src="sidekick-icons.html"></script>
  <script src="app.js"></script>
</body>
</html>
